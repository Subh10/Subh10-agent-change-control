[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-change-control"
version = "0.1.0"
description = "A simulation-only policy gate for AI-generated database changes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
acc = "agent_change_control.cli:main"

[tool.setuptools.packages.find]
include = ["agent_change_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
